[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turnonetelementry"
version = "1.4.1"
description = "Formula 1 Telemetry Data Analysis and Visualization API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TurnOneTelemetry Team"}
]
keywords = ["formula1", "f1", "telemetry", "data-analysis", "visualization", "racing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "fastf1>=3.3.0",
    "matplotlib>=3.7.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "timple",
    "Pillow",
    "pymongo>=4.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "sentry-sdk[fastapi]>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "httpx>=0.25.0",
    "mongomock>=4.1.0",
    "responses>=0.24.0",
    "freezegun>=1.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "mypy>=1.4.0",
    "bandit>=1.7.5",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/TurnOneTelemetry"
Documentation = "https://github.com/yourusername/TurnOneTelemetry/blob/master/README.md"
Repository = "https://github.com/yourusername/TurnOneTelemetry"
Issues = "https://github.com/yourusername/TurnOneTelemetry/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__.__version__"}

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/__version__.py:__version__"]
branch = "master"
upload_to_vcs_release = true
upload_to_pypi = false
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.master]
match = "(master|main)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore",
    "^ci",
    "^docs",
    "^style",
    "^test",
    "Merge pull request",
    "Merge branch",
]

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
  | cache
  | outputs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/cache/*", "*/outputs/*", "*/.venv/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=53 --ignore=tests/old --ignore=tests/_legacy"
asyncio_mode = "auto"
markers = [
    "integration: end-to-end via FastAPI TestClient",
    "unit: pure unit test, no external deps",
    "slow: excluded from default fast loop",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    # Heavy data-generation / plotting code paths — exercised end-to-end in
    # production but explicitly out of scope for the automated unit/integration
    # suite (would require live FastF1, real Mongo, real plot rendering).
    "src/services/analysis/v1/*",
    "src/services/analysis/v2/*",
    "src/services/plotting/*",
    "src/services/orchestrator.py",
    "src/services/orchestrator_helpers.py",
    "src/workers/*",
    "src/repositories/bulk_store.py",
    "src/repositories/populate_seasons.py",
    "src/repositories/seasonal_data.py",
    "src/repositories/seasons_manager.py",
    "src/repositories/plots.py",
    "src/core/observability/*",
    "src/auth/*",
    "src/domain/data/*",
    "src/ingestion/circuits_loader.py",
    "src/ingestion/fastf1_client.py",
    "src/ingestion/reference.py",
    # Routers are exercised at the HTTP layer in integration tests; their
    # bodies invoke service code that's omitted above, so per-line coverage
    # is misleading.
    "src/api/routers/admin.py",
    "src/api/routers/analysis_v1.py",
    "src/api/routers/analysis_v2.py",
    "src/api/routers/seasonal_v1.py",
    "src/api/routers/seasonal_v2.py",
    "src/api/routers/circuits_api.py",
    "src/api/routers/monitoring.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 120
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]
