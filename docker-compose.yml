services:
  t1api:
    build: .
    container_name: T1API
    restart: unless-stopped
    ports:
      - '${HOST_PORT}:5000'
    volumes:
      - ./cache:/app/cache
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env.production
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_HOST=${MONGODB_HOST}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-T1API_DB}
      - MONGODB_MAX_POOL_SIZE=${MONGODB_MAX_POOL_SIZE:-50}
      - MONGODB_MIN_POOL_SIZE=${MONGODB_MIN_POOL_SIZE:-10}
      - MONGODB_TIMEOUT_MS=${MONGODB_TIMEOUT_MS:-30000}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-false}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-us-east-1}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-t1api}
      - BACKUP_S3_FORCE_PATH_STYLE=${BACKUP_S3_FORCE_PATH_STYLE:-true}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_SCHEDULE_HOUR_UTC=${BACKUP_SCHEDULE_HOUR_UTC:-2}
      - BACKUP_SCHEDULE_MINUTE_UTC=${BACKUP_SCHEDULE_MINUTE_UTC:-0}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-7}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-4}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-6}
      - BACKUP_INCLUDE_VOLUMES=${BACKUP_INCLUDE_VOLUMES:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - f1-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  f1-network:
    driver: bridge