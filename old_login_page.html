<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T1API — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {{ box-sizing: border-box; margin: 0; padding: 0; }}

  :root {{
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #e8003d;
    --accent-dim: rgba(232,0,61,0.12);
    --text: #e8e8f0;
    --muted: #555570;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }}

  body {{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }}

  /* Animated grid background */
  body::before {{
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,0,61,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,0,61,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridPan 20s linear infinite;
    pointer-events: none;
  }}

  @keyframes gridPan {{
    0%   {{ background-position: 0 0; }}
    100% {{ background-position: 48px 48px; }}
  }}

  /* Glow blob */
  body::after {{
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(232,0,61,0.08) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }}

  @keyframes pulse {{
    0%, 100% {{ opacity: 0.6; transform: translate(-50%, -50%) scale(1); }}
    50%       {{ opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }}
  }}

  .card {{
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }}

  @keyframes slideUp {{
    from {{ opacity: 0; transform: translateY(24px); }}
    to   {{ opacity: 1; transform: translateY(0); }}
  }}

  /* Top accent bar */
  .card::before {{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }}

  .logo {{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
  }}

  .logo-mark {{
    width: 36px; height: 36px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
  }}

  .logo-text {{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--text);
  }}

  .logo-sub {{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
  }}

  h1 {{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }}

  .subtitle {{
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }}

  label {{
    display: block;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }}

  input {{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
  }}

  input:focus {{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }}

  button {{
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 2px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }}

  button:hover  {{ opacity: 0.88; }}
  button:active {{ transform: scale(0.98); }}

  .error {{
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(232,0,61,0.1);
    border: 1px solid rgba(232,0,61,0.3);
    border-radius: 2px;
    color: #ff4d6d;
    font-size: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }}

  .footer {{
    margin-top: 28px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.08em;
  }}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">T1</div>
    <div>
      <div class="logo-text">T1API</div>
      <div class="logo-sub">Developer Portal</div>
    </div>
  </div>

  <h1>Documentation</h1>
  <p class="subtitle">Restricted Access</p>

  {error_html}

  <form method="post" action="/docs/login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Access Documentation →</button>
  </form>

  <div class="footer">turnonehub.com &nbsp;·&nbsp; t1f1.com</div>
</div>
</body>
</html>
